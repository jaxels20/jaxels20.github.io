<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      data-goatcounter="https://jeppebergaxelsen.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="https://gc.zgo.at/count.js"
    ></script>
    <script>
      ;(function (location) {
        if (!location.search.startsWith('?/')) {
          return
        }

        const decodedPath = location.search
          .slice(2)
          .split('&')
          .map((segment) => segment.replace(/~and~/g, '&'))
          .join('?')

        const basePath = location.pathname.replace(/\/$/, '')
        const routePath = decodedPath.startsWith('/') ? decodedPath : `/${decodedPath}`
        const nextUrl = `${basePath}${routePath}${location.hash}`
        window.history.replaceState(null, '', nextUrl)
      })(window.location)
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      />
    </noscript>
    <meta name="theme-color" content="#0b0d10" />
    <title>Badminton Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
